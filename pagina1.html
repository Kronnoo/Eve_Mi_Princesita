<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Personas a las que amo por cada letra del abecedario🙀</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --tarjeta-ancho: 330px;
      --tarjeta-alto: 220px;
      --tarjeta-border-radius: 32px;
      --transicion: 0.5s cubic-bezier(.7,.3,0,1.2);
    }
    body {
      min-height: 100vh;
      background: linear-gradient(120deg,#f8bfff 0%,#b6e0ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Segoe UI', 'Arial Rounded MT Bold', Arial, sans-serif;
      user-select: none;
    }
    #contenedor {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .tarjeta {
      width: var(--tarjeta-ancho);
      height: var(--tarjeta-alto);
      border-radius: var(--tarjeta-border-radius);
      box-shadow: 0 6px 36px 0 rgba(90,60,120,0.13),0 1.5px 6px 0 rgba(80,20,70,0.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #333;
      background: #fff;
      cursor: pointer;
      transition: transform var(--transicion), box-shadow var(--transicion), background var(--transicion), opacity var(--transicion);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      padding: 24px 20px;
      margin: 12px;
      opacity: 1;
      z-index: 1;
    }
    .letra-tarjeta {
      font-size: 3.7rem;
      font-weight: bold;
      opacity: 0.20;
      position: absolute;
      top: 10px;
      left: 20px;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    .mensaje-tarjeta {
      position: relative;
      z-index: 2;
      font-size: 1.44rem;
      font-weight: 500;
      margin-top: 38px;
      letter-spacing: 0.02em;
    }

    .emojis {
      font-size: 2.1rem;
      margin-bottom: 16px;
      margin-top: 0;
      user-select: none;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 0.3em;
    }

    /* Colores y estilos únicos por tarjeta (degradados, formas, etc.) */
    .t0 { background: linear-gradient(120deg,#ffe4e1 0%,#ffb6b9 100%); color:#9b2b4d;}
    .t1 { background: linear-gradient(120deg,#e0c3fc 0%,#8ec5fc 100%); color:#512da8;}
    .t2 { background: linear-gradient(120deg,#fff1eb 0%,#ace0f9 100%); color:#0d47a1;}
    .t3 { background: linear-gradient(120deg,#f9fbe7 0%,#f9d423 100%); color:#b28704;}
    .t4 { background: linear-gradient(120deg,#cfd9df 0%,#e2ebf0 100%); color:#374151;}
    .t5 { background: linear-gradient(120deg,#fbc2eb 0%,#a6c1ee 100%); color:#c2185b;}
    .t6 { background: linear-gradient(120deg,#e0eafc 0%,#cfdef3 100%); color:#283593;}
    .t7 { background: linear-gradient(120deg,#d4fc79 0%,#96e6a1 100%); color:#388e3c;}
    .t8 { background: linear-gradient(120deg,#fceabb 0%,#f8b500 100%); color:#b26a00;}
    .t9 { background: linear-gradient(120deg,#c2ffd8 0%,#465efb 100%); color:#2941ab;}
    .t10{ background: linear-gradient(120deg,#fdcbf1 0%,#e6dee9 100%); color:#ad1457;}
    .t11{ background: linear-gradient(120deg,#f2d50f 0%,#da0641 100%); color:#da0641;}
    .t12{ background: linear-gradient(120deg,#a1c4fd 0%,#c2e9fb 100%); color:#0d47a1;}
    .t13{ background: linear-gradient(120deg,#f5f7fa 0%,#c3cfe2 100%); color:#374151;}
    .t14{ background: linear-gradient(120deg,#ffecd2 0%,#fcb69f 100%); color:#d84315;}
    .t15{ background: linear-gradient(120deg,#ffdde1 0%,#ee9ca7 100%); color:#c62828;}
    .t16{ background: linear-gradient(120deg,#f3e7e9 0%,#e3eeff 100%); color:#1976d2;}
    .t17{ background: linear-gradient(120deg,#f6d365 0%,#fda085 100%); color:#e65100;}
    .t18{ background: linear-gradient(120deg,#e0eafc 0%,#cfdef3 100%); color:#6a1b9a;}
    .t19{ background: linear-gradient(120deg,#fceabb 0%,#f8b500 100%); color:#b26a00;}
    .t20{ background: linear-gradient(120deg,#c2ffd8 0%,#465efb 100%); color:#2941ab;}
    .t21{ background: linear-gradient(120deg,#d4fc79 0%,#96e6a1 100%); color:#388e3c;}
    .t22{ background: linear-gradient(120deg,#fbc2eb 0%,#a6c1ee 100%); color:#c2185b;}
    .t23{ background: linear-gradient(120deg,#f2d50f 0%,#da0641 100%); color:#da0641;}
    .t24{ background: linear-gradient(120deg,#fdcbf1 0%,#e6dee9 100%); color:#ad1457;}
    .t25{ background: linear-gradient(120deg,#a1c4fd 0%,#c2e9fb 100%); color:#0d47a1;}

    .titulo-tarjetero {
      font-size: 1.45rem;
      font-weight: bold;
      color: #5a237e;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 0 #fff;
      opacity: 0.96;
      margin: 0;
    }
    .final {
      background: rgba(255,255,255,0.83);
      color: #ad1457;
      font-size: 1.1rem;
      font-weight: 400;
      border: none;
      box-shadow: none;
      cursor: default;
      margin-top: 12px;
      min-height: unset;
      height: auto;
      transition: none;
      padding: 18px 10px 8px 10px;
    }
    .final .teamo {
      font-size: 0.72rem;
      color: #ad1457;
      font-weight: 700;
      opacity: 0.74;
      margin-top: 24px;
      display: block;
      letter-spacing: 0.09em;
      transition: none;
    }
    /* Animación de deslizamiento */
    .slide-in-right {
      animation: slideInRight 0.5s both;
    }
    .slide-out-left {
      animation: slideOutLeft 0.5s both;
    }
    .slide-in-left {
      animation: slideInLeft 0.5s both;
    }
    .slide-out-right {
      animation: slideOutRight 0.5s both;
    }
    @keyframes slideInRight {
      from { transform: translate(70vw, -50%) scale(.95); opacity:0; }
      to   { transform: translate(-50%, -50%) scale(1); opacity:1;}
    }
    @keyframes slideOutLeft {
      from { transform: translate(-50%, -50%) scale(1); opacity:1;}
      to   { transform: translate(-70vw, -50%) scale(.95); opacity:0;}
    }
    @keyframes slideInLeft {
      from { transform: translate(-70vw, -50%) scale(.95); opacity:0; }
      to   { transform: translate(-50%, -50%) scale(1); opacity:1;}
    }
    @keyframes slideOutRight {
      from { transform: translate(-50%, -50%) scale(1); opacity:1;}
      to   { transform: translate(70vw, -50%) scale(.95); opacity:0;}
    }
    @media (max-width: 480px) {
      .tarjeta { width: 96vw; height: 180px; font-size:1.1rem; }
      .letra-tarjeta { font-size: 2.4rem; left: 10px; top: 6px;}
      .mensaje-tarjeta { font-size: 1rem; margin-top: 20px;}
      .titulo-tarjetero { font-size:1.02rem;}
    }
  </style>
</head>
<body>
  <div id="contenedor" style="position:relative;">
    <div class="tarjeta t0 slide-in-right" id="tarjeta" onclick="avanzar()">
      <span class="mensaje-tarjeta" id="mensaje-inicial">Haz clic aquí…</span>
    </div>
  </div>
  <script>
    // Datos de tarjetas: letra, mensaje y emojis personalizados
    const tarjetas = [
      { letra: "A", mensaje: "A ti",        emojis: "🙀💗" },
      { letra: "B", mensaje: "Bueno, tú",   emojis: "❤️💗" },
      { letra: "C", mensaje: "Claramente tú",emojis: "😸💗" },
      { letra: "D", mensaje: "Debes ser tú",emojis: "😺💗" },
      { letra: "E", mensaje: "Emm, tú",     emojis: "🙀💗" },
      { letra: "F", mensaje: "Felizmente tú",emojis: "❤️💗" },
      { letra: "G", mensaje: "G tu",        emojis: "😸💗" },
      { letra: "H", mensaje: "Hola, tú",    emojis: "😺💗" },
      { letra: "I", mensaje: "Igual tú",    emojis: "🙀💗" },
      { letra: "J", mensaje: "Jajaja tú",   emojis: "❤️💗" },
      { letra: "K", mensaje: "Ksjshgksk tú",emojis: "😸💗" },
      { letra: "L", mensaje: "Lo sabes tú", emojis: "😺💗" },
      { letra: "M", mensaje: "Mmm tú",      emojis: "🙀💗" },
      { letra: "N", mensaje: "No hay nadie como tú", emojis: "❤️💗" }, // NUEVA
      { letra: "O", mensaje: "On, tú",      emojis: "😸💗" },
      { letra: "P", mensaje: "Pues tú",     emojis: "😺💗" },
      { letra: "Q", mensaje: "Que tú",      emojis: "🙀💗" },
      { letra: "R", mensaje: "Realmente tú",emojis: "❤️💗" },
      { letra: "S", mensaje: "Solamente tú",emojis: "😸💗" },
      { letra: "T", mensaje: "Tú",          emojis: "😺💗" },
      { letra: "U", mensaje: "Únicamente tú",emojis: "🙀💗" },
      { letra: "V", mensaje: "Vaya, tú",    emojis: "❤️💗" },
      { letra: "W", mensaje: "Wii tú",      emojis: "😸💗" },
      { letra: "X", mensaje: "xd tú",       emojis: "😺💗" },
      { letra: "Y", mensaje: "Ya sabes, tú", emojis: "🙀💗" }, // NUEVA
      { letra: "Z", mensaje: "Zi tú",       emojis: "❤️💗" }
    ];
    // Los estilos únicos por tarjeta
    function claseTarjeta(idx) { return 'tarjeta t' + (idx % 26); }

    // Estados: 0=inicial, 1=titulo, 2+=tarjetas, final=despedida
    let estado = 0;
    let indiceTarjeta = -1;
    let animando = false;

    const contenedor = document.getElementById('contenedor');
    let tarjetaDiv = document.getElementById('tarjeta');

    function crearTarjetaHtml({letra, mensaje, emojis}, idx) {
      return `
        <div class="${claseTarjeta(idx)} slide-in-right tarjeta" style="cursor:pointer;">
          <span class="emojis">${emojis}</span>
          <span class="letra-tarjeta">${letra}</span>
          <span class="mensaje-tarjeta">${mensaje}</span>
        </div>
      `;
    }

    function avanzar() {
      if (animando) return; // Evita doble clic durante animación
      estado++;
      // Primer clic: título
      if (estado === 1) {
        slideTarjeta(`<div class="tarjeta t0 slide-in-right" style="cursor:pointer;"><span class="titulo-tarjetero">Personas a las que amo por cada letra del abecedario</span></div>`);
      }
      // Tarjetas del abecedario
      else if (estado <= tarjetas.length + 1) {
        indiceTarjeta++;
        const t = tarjetas[indiceTarjeta];
        slideTarjeta(crearTarjetaHtml(t, indiceTarjeta));
      }
      // Final
      else {
        slideTarjeta(`<div class="tarjeta final slide-in-right">
            <span>Eso era todo…</span>
            <span class="teamo">Te amo💗</span>
        </div>`, true);
      }
    }

    function slideTarjeta(html, esFinal=false) {
      animando = true;
      // Animación de salida
      tarjetaDiv.classList.remove('slide-in-right','slide-in-left');
      tarjetaDiv.classList.add('slide-out-left');
      tarjetaDiv.style.pointerEvents = 'none';

      setTimeout(() => {
        contenedor.removeChild(tarjetaDiv);

        // Crear nueva tarjeta
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const nuevaTarjeta = temp.firstElementChild;
        nuevaTarjeta.onclick = esFinal ? null : avanzar;
        contenedor.appendChild(nuevaTarjeta);
        // Forzar reflow y animar entrada
        setTimeout(() => {
          nuevaTarjeta.classList.remove('slide-out-left','slide-out-right');
          nuevaTarjeta.classList.add('slide-in-right');
          tarjetaDiv = nuevaTarjeta;
          animando = false;
        }, 30);
      }, 480);
    }
    // Primer mensaje ya está puesto (Haz clic aquí…)
  </script>
</body>
</html>
