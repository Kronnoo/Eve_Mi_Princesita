<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sorpresa 3 💌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap');
    body {
      background: linear-gradient(135deg, #F7D9FF, #FFE4E1);
      font-family: 'Mochiy Pop One', cursive;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #75678A;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 35px;
      border-radius: 25px;
      border: 2px solid #DDA0DD;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h1 { color: #C71585; margin-bottom: 15px; }
    p { line-height: 1.6; font-size: 1.05em; }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #DDA0DD;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #B2FFD6; color: #75678A; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nuestro Futuro 💌✨</h1>
    <p>Mi compromiso contigo es trabajar siempre por una comunicación transparente, sincera y llena de cariño. Quiero acompañarte en cada una de tus metas y crecer juntos día a día 😼💗.</p>
    <a href="index.html" class="back-btn">⬅ Volver al Menú</a>
  </div>
</body>
</html>
