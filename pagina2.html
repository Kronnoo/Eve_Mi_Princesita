    :root {
      --rosa: #ff72a1;
      --azulito: #cce7ff;
      --sombra: rgba(0,0,0,0.10);
      --card-width: 350px;
      --card-height: 360px;
      --movimiento: 44px;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(120deg, #ffe0ec 0%, #cce7ff 100%);
      font-family: 'Segoe UI', 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .center {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .caja {
      position: relative;
      width: var(--card-width);
      height: var(--card-height);
      background: white;
      border-radius: 28px;
      box-shadow: 0 5px 26px var(--sombra);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 24px 30px 24px;
      transition: transform 0.7s cubic-bezier(.16,.84,.44,1.11), box-shadow 0.4s;
      z-index: 2;
      overflow: hidden;
    }
    .caja.zoomed {
      transform: scale(1.12) translateY(-30px);
      box-shadow: 0 12px 44px #e7548093;
    }
    .inicio-contenido {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2em;
      position: absolute;
      top: 0; left: 0;
      z-index: 3;
      background: transparent;
      transition: opacity 0.4s;
    }
    .inicio-contenido.oculto {
      opacity: 0;
      pointer-events: none;
    }
    .titulo-inicio {
      font-size: 1.4em;
      color: var(--rosa);
      font-weight: 600;
      text-align: center;
      letter-spacing: .5px;
    }
    .hazclick {
      font-size: 1.15em;
      color: #e75480;
      font-weight: 500;
      letter-spacing: .5px;
      cursor: pointer;
      z-index: 2;
      animation: pulse 1.35s infinite;
      transition: opacity 0.3s;
      background: #fff6fa;
      border-radius: 1em;
      padding: 0.3em 1.2em;
      border: 1.5px solid #ffc6dc;
      box-shadow: 0 1px 8px #e7548018;
      margin-top: 0.4em;
      text-shadow: 0 0 0px #e75480;
      outline: none;
      user-select: none;
    }
    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 0px #e75480; }
      50% { text-shadow: 0 0 6px #e754809a; }
    }
    .tarjeta {
      position: absolute;
      top: 90px;
      left: 0; right: 0;
      margin: auto;
      width: 90%;
      min-height: 100px;
      background: #fff6fa;
      border-radius: 18px;
      box-shadow: 0 2px 18px #e7548012;
      color: #505050;
      font-size: 1.13em;
      line-height: 1.3em;
      padding: 1.6em 1.1em;
      opacity: 0;
      pointer-events: none;
      transform: translateX(var(--movimiento));
      transition: opacity 0.5s, transform 0.45s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1;
      font-weight: 500;
    }
    .tarjeta.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }
    .tarjeta.saliente-izq {
      opacity: 0;
      transform: translateX(-100%);
      transition: opacity 0.3s, transform 0.35s;
    }
    .tarjeta.saliente-der {
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.3s, transform 0.35s;
    }
    .controles {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 2.5em;
      z-index: 10;
    }
    .control-btn {
      background: #ff72a1;
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.8em;
      cursor: pointer;
      box-shadow: 0 2px 10px #e7548055;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s;
      user-select: none;
    }
    .control-btn:disabled {
      background: #ffd0e0;
      color: #fff6fa;
      cursor: default;
      opacity: 0.6;
    }
    .contador {
      position: absolute;
      bottom: 9px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.97em;
      color: #e75480b9;
      letter-spacing: .5px;
      font-weight: 500;
      z-index: 9;
    }
    .footer {
      margin-top: 2em;
      color: #afafaf;
      font-size: 0.96em;
      text-align: center;
      user-select: none;
    }
    @media (max-width: 420px) {
      :root { --card-width: 98vw; --card-height: 74vh; }
      .caja { padding: 24px 2vw 18px 2vw; }
      .tarjeta { font-size: 1em; padding: 1.1em 0.5em;}
    }
  </style>
</head>

      intro.className = 'tarjeta';
      intro.innerHTML = `<span style="color:#e75480;font-size:1.18em;">Me enamoré de ti por:</span>`;

      tarjetas.push(intro);

        div.className = 'tarjeta';
        div.innerHTML = `<span>${i+1}. ${razon}</span>`;
        caja.appendChild(div);
        tarjetas.push(div);
      });
    }

    // Muestra tarjeta en índice "i" con animación
    function mostrarTarjeta(i, dir = 0) {
      if (animando) return;
      animando = true;
      tarjetas.forEach((t, idx) => {
        t.classList.remove('visible','saliente-izq','saliente-der');
        if(idx === i) {
          setTimeout(() => t.classList.add('visible'), 18);
        } else if(idx === actual && idx !== i) {
          // Animación de salida
          t.classList.add(dir === 1 ? 'saliente-izq' : 'saliente-der');
        }
      });
      setTimeout(() => {
        animando = false;
      }, 390);
      // Flechas y contador
      prevBtn.disabled = i <= 0;
      nextBtn.disabled = i >= tarjetas.length-1;
      contador.textContent = (i === 0) 
        ? `¡Comencemos! (${razones.length} razones 💖)` 
        : `${i} / ${razones.length}`;
      contador.style.display = 'block';
      controles.style.display = 'flex';
    }

      inicioContenido.classList.add('oculto');
      setTimeout(() => {
        inicioContenido.style.display = 'none';
        crearTarjetas();
        actual = 0;
        mostrarTarjeta(0, 1);
      }, 550);
    };

    // Navegación
    prevBtn.onclick = () => {
      if(actual > 0) {
        mostrarTarjeta(--actual, 1);
      }
    };
    nextBtn.onclick = () => {
      if(actual < tarjetas.length-1) {
        mostrarTarjeta(++actual, 0);
      }
    };

    let startX = 0;
    caja.addEventListener('touchstart', e => {
      if(e.touches.length === 1) startX = e.touches[0].clientX;
    });
    caja.addEventListener('touchend', e => {
      if(e.changedTouches.length === 1 && actual >= 0) {
        let endX = e.changedTouches[0].clientX;
        let dx = endX - startX;
        if(dx > 55 && actual > 0) prevBtn.click();
        if(dx < -55 && actual < tarjetas.length-1) nextBtn.click();
      }
    });

    document.addEventListener('keydown', e => {
      if(actual > 0 && (e.key === "ArrowLeft" || e.key === "a")) prevBtn.click();
      if(actual < tarjetas.length-1 && (e.key === "ArrowRight" || e.key === "d")) nextBtn.click();
    });
