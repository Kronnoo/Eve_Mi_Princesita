<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sorpresa 2 🧸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap');
    body {
      background: linear-gradient(135deg, #B2FFD6, #FFF0F5);
      font-family: 'Mochiy Pop One', cursive;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #75678A;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 35px;
      border-radius: 25px;
      border: 2px solid #B2FFD6;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h1 { color: #8BE3B0; margin-bottom: 15px; }
    p { line-height: 1.6; font-size: 1.05em; }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #8BE3B0;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #FFB6C1; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Un Abrazo Gigante 🧸💗</h1>
    <p>No importa qué tan pesado o complicado sea el día, saber que cuento contigo me da toda la serenidad y fuerza necesaria. Eres mi refugio y mi persona favorita 🐱.</p>
    <a href="index.html" class="back-btn">⬅ Volver al Menú</a>
  </div>
</body>
</html>
