<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuestros Momentos Especiales 💗✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=RocknRoll+One&display=swap');

    * { box-sizing: border-box; }
    body {
      background: linear-gradient(120deg, #B2FFD6 30%, #F7D9FF 100%);
      font-family: 'Mochiy Pop One', 'RocknRoll One', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #75678A;
      padding: 20px;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 2.5px solid #FFB6C1;
      box-shadow: 0 10px 32px rgba(100, 100, 100, 0.15);
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h1 { color: #FFB6C1; font-size: 1.8em; margin-bottom: 8px; text-shadow: 1px 1px 4px #fff; }
    p.subtitle { font-size: 0.95em; margin-bottom: 28px; color: #75678A; }
    .button-grid { display: flex; flex-direction: column; gap: 16px; }

    .btn-card {
      background: #ffffff;
      color: #6f4683;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 20px;
      border: 2px solid #FFB6C1;
      font-size: 1.05em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.2);
    }

    .btn-card:hover {
      background: #FFB6C1;
      color: #ffffff;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <div class="menu-card">
    <h1>Evelyn 💗✨</h1>
    <p class="subtitle">Elige una opción para ver el momento hermoso que vivimos:</p>

    <div class="button-grid">
      <a href="pagina1.html" class="btn-card">
        <span>Sorpresa 1</span>
        <span>🌸</span>
      </a>

      <a href="pagina2.html" class="btn-card">
        <span>Sorpresa 2</span>
        <span>🧸</span>
      </a>

      <a href="pagina3.html" class="btn-card">
        <span>Sorpresa 3</span>
        <span>💌</span>
      </a>

      <a href="pagina4.html" class="btn-card">
        <span>Confesión Especial (Universo 3D)</span>
        <span>🌌</span>
      </a>
    </div>
  </div>

</body>
</html>
